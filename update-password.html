<!doctype html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#100b09" />
  <title>ახალი პაროლი — Yoko Shop</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+Georgian:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="auth.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="supabase-config.js" defer></script>
  <script src="update-password.js" defer></script>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-brand-panel"><a class="auth-logo" href="index.html"><img src="logo.png" alt="Yoko Shop" /></a><div class="auth-brand-copy"><p class="auth-eyebrow"><span></span> YOKO SHOP</p><h1>ახალი პაროლი.<br /><em>ახალი დასაწყისი.</em></h1><p>შეარჩიე ახალი, უსაფრთხო პაროლი შენი ანგარიშისთვის.</p></div><div class="auth-brand-footer"><span>თბილისი, საქართველო</span><span>YOKO SHOP <b>✳</b></span></div><span class="auth-orbit orbit-one"></span><span class="auth-orbit orbit-two"></span></section>
    <section class="auth-form-panel"><div class="auth-form-top"><span>ანგარიშის დაცვა</span><span class="auth-step"><i></i> ახალი პაროლი</span></div><div class="auth-form-wrap"><p class="auth-eyebrow form-eyebrow">პაროლის შეცვლა</p><h2>შეიყვანე<br /><em>ახალი პაროლი</em></h2><p class="auth-intro" id="update-status">ვამოწმებთ აღდგენის ბმულს…</p><form id="update-password-form" class="registration-form" hidden><label for="new-password">ახალი პაროლი</label><input id="new-password" name="password" type="password" autocomplete="new-password" minlength="8" required placeholder="მინიმუმ 8 სიმბოლო" /><label for="confirm-password">გაიმეორე პაროლი</label><input id="confirm-password" name="confirm" type="password" autocomplete="new-password" minlength="8" required placeholder="პაროლი კიდევ ერთხელ" /><p class="auth-error" id="update-error" role="alert" hidden></p><button class="auth-submit" type="submit">პაროლის შენახვა <span>↗</span></button></form><a class="auth-back-link" href="index.html?view=login">შესვლის გვერდზე დაბრუნება</a></div><footer class="auth-bottom"><span>© 2026 Yoko Shop</span><span>შექმნილია სიყვარულით <b>✳</b></span></footer></section>
  </main>
</body>
</html>
